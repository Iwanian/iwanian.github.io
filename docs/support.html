<style>
:root{--void:#07052a;--panel:#0f0b3a;--panel-2:#16114d;--line:rgba(176,166,255,.2);--text:#efedff;--muted:#aeabd8;--ember:#ffa63d;--ember-ink:#2a1300;--gold:#ffd98a;--arc:#7fb2ff;--ok:#7ee0b0;
--f-body:"Vazirmatn",system-ui,"Segoe UI",Tahoma,sans-serif;--f-mark:"Josefin Sans","Helvetica Neue",Arial,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--void);color:var(--text);font:400 1rem/1.9 var(--f-body);direction:rtl;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(7,5,42,.55),rgba(7,5,42,.94) 70%),url(assets/galaxy.webp) center/cover no-repeat}
a{color:var(--arc)}
:focus-visible{outline:2px solid var(--arc);outline-offset:3px;border-radius:6px}
.wrap{width:min(1040px,100% - 32px);margin-inline:auto}
header.top{position:sticky;top:0;z-index:5;background:rgba(7,5,42,.78);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.brand img{width:28px;height:28px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(255,166,61,.55),0 0 18px rgba(255,166,61,.25)}
.brand b{font:300 1.15rem/1 var(--f-mark);letter-spacing:.34em;direction:ltr;padding-left:.34em}
.back{color:var(--text);text-decoration:none;font-weight:500;font-size:.95rem;padding:.4rem .9rem;border:1px solid var(--line);border-radius:11px;background:rgba(15,11,58,.8)}
.back:hover{border-color:var(--arc)}
.hero{padding:clamp(48px,9vw,96px) 0 28px;text-align:center}
.hero h1{margin:0;font-size:clamp(2rem,6vw,3.2rem);font-weight:800;line-height:1.3;text-shadow:0 0 38px rgba(255,166,61,.35)}
.hero p{margin:.8rem auto 0;max-width:46ch;color:#dcd8ff;font-size:1.05rem}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));padding-bottom:70px}
.card{display:flex;flex-direction:column;gap:.8rem;min-width:0;padding:20px;border-radius:18px;background:rgba(15,11,58,.88);border:1px solid var(--line);box-shadow:0 10px 30px rgba(3,2,20,.45)}
.head{display:flex;align-items:center;gap:12px}
.badge{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;font:700 .8rem/1 var(--f-mark);letter-spacing:.02em;color:#10082a;background:var(--c,var(--ember));box-shadow:0 0 0 3px rgba(255,255,255,.06),0 0 24px color-mix(in srgb,var(--c,var(--ember)) 40%,transparent)}
.head h2{margin:0;font-size:1.15rem;font-weight:700;line-height:1.4}
.net{display:inline-block;margin-top:2px;font-size:.74rem;padding:.02rem .6rem;border-radius:999px;border:1px solid var(--line);color:var(--gold);background:rgba(255,166,61,.1)}
.addr{display:block;direction:ltr;text-align:left;unicode-bidi:isolate;font:400 .86rem/1.7 var(--f-mono);word-break:break-all;overflow-wrap:anywhere;padding:.7rem .85rem;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);user-select:all}
.note{margin:0;font-size:.88rem;color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:42px;padding:.4rem 1.1rem;border-radius:12px;border:1px solid var(--line);background:rgba(15,11,58,.8);color:var(--text);font:500 .92rem/1.3 var(--f-body);cursor:pointer}
.btn:hover{border-color:var(--arc)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:var(--ember-ink);font-weight:700}
.btn.primary:hover{background:var(--gold);border-color:var(--gold)}
.tg-link{display:inline-flex;align-items:center;gap:6px}.tg-link svg{flex:none}.qr[hidden]{display:none}.qr{display:grid;place-items:center;padding:14px;border-radius:14px;background:#fff}
.qr svg{width:min(100%,220px);height:auto;display:block}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 16px;border:1px dashed var(--line);border-radius:16px}
footer{padding:0 0 40px;text-align:center;color:var(--muted);font-size:.88rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<script>
(function(){
  'use strict';
  var COLORS = {BTC:'#f7931a', ETH:'#9db0ff', USDT:'#26a17b', USDC:'#2775ca', TRX:'#ff5a64', TON:'#3aa0ff', LTC:'#c3cad8', BNB:'#f3ba2f', SOL:'#a76bff', DOGE:'#d4b440', XMR:'#ff7a1a'};
  var DEFAULT = {title:'حمایت از ما', intro:'اگر کار ما برایتان مفید بوده، با ارز دیجیتال از ادامهٔ راه حمایت کنید. هر مبلغی، هرچند کوچک، ارزشمند است.', wallets:[]};
  var $ = function(s){ return document.querySelector(s); };
  function el(tag, attrs, kids){
    var n = document.createElement(tag);
    for (var k in (attrs || {})){ if (k === 'class') n.className = attrs[k]; else if (k === 'text') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); }
    (kids || []).forEach(function(c){ if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function copy(text, btn){
    var done = function(){ var o = btn.textContent; btn.textContent = 'کپی شد ✓'; setTimeout(function(){ btn.textContent = o; }, 1500); };
    function fallback(){ var t = el('textarea', {'aria-hidden':'true'}); t.value = text; t.style.cssText = 'position:fixed;opacity:0;top:0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (e) {} t.remove(); }
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  }
  function qrSvg(text){
    try { var q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:4, margin:0, scalable:true}); } catch (e) { return ''; }
  }
  function card(w){
    var sym = String(w.symbol || '').toUpperCase().slice(0, 5);
    var badge = el('span', {class:'badge', 'aria-hidden':'true', text:sym || '₿'}); badge.style.setProperty('--c', COLORS[sym] || '#ffa63d');
    var title = el('div', {}, [el('h2', {text:w.coin || sym}), w.network ? el('span', {class:'net', text:w.network}) : null]);
    var addr = el('code', {class:'addr', text:w.address});
    var copyBtn = el('button', {type:'button', class:'btn primary', text:'کپی آدرس'});
    copyBtn.addEventListener('click', function(){ copy(w.address, copyBtn); });
    var qrBox = el('div', {class:'qr', hidden:''}), qrBtn = el('button', {type:'button', class:'btn', text:'نمایش QR', 'aria-expanded':'false'});
    qrBtn.addEventListener('click', function(){
      var open = qrBox.hidden;
      if (open && !qrBox.firstChild){ var svg = qrSvg(w.address); if (svg) qrBox.innerHTML = svg; else qrBox.textContent = 'QR ساخته نشد.'; }
      qrBox.hidden = !open; qrBtn.textContent = open ? 'پنهان کردن QR' : 'نمایش QR'; qrBtn.setAttribute('aria-expanded', String(open));
    });
    return el('article', {class:'card'}, [el('div', {class:'head'}, [badge, title]), addr, w.note ? el('p', {class:'note', text:w.note}) : null, el('div', {class:'acts'}, [copyBtn, qrBtn]), qrBox]);
  }
  function render(c){
    var s = c && c.support ? c.support : DEFAULT;
    $('#title').textContent = s.title || DEFAULT.title; $('#intro').textContent = s.intro || DEFAULT.intro;
    var host = $('#wallets'); host.textContent = '';

    if (!list.length) host.appendChild(el('p', {class:'empty', text:'هنوز آدرسی اضافه نشده است.'}));
    list.forEach(function(w){ host.appendChild(card({coin:String(w.coin || ''), symbol:String(w.symbol || ''), network:String(w.network || ''), address:String(w.address).trim().slice(0, 200), note:String(w.note || '').slice(0, 300)})); });
  }

  fetch('data/content.json', {cache:'no-cache'}).then(function(r){ if (!r.ok) throw 0; return r.json(); }).then(render).catch(function(){});
})();
